/users:
  post:
    summary: Create a new user
    tags:
      - Users
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - firstName
              - lastName
            properties:
              email:
                type: string
                format: email
                example: burak@example.com
              firstName:
                type: string
                example: Burak
              lastName:
                type: string
                example: Yilmaz
    responses:
      "201":
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSuccessResponse"
      "400":
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "409":
        description: User already exists

  get:
    summary: Get all users
    tags:
      - Users
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
    responses:
      "200":
        description: Users retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsersSuccessResponse"
      "400":
        description: Invalid pagination parameters

/users/{id}:
  get:
    summary: Get user by ID
    tags:
      - Users
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      "200":
        description: User retrieved successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSuccessResponse"
      "400":
        description: Invalid user ID
      "404":
        description: User not found

  patch:
    summary: Update an existing user
    tags:
      - Users
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              email:
                type: string
                format: email
              firstName:
                type: string
                minLength: 2
                maxLength: 50
              lastName:
                type: string
                minLength: 2
                maxLength: 50
    responses:
      "200":
        description: User updated successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSuccessResponse"
      "400":
        description: Validation failed or invalid user ID
      "404":
        description: User not found
